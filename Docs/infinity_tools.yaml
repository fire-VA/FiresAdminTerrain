      Remove biome override on overlapping tiles (vanilla biome wins again).
    icon: SledgeDemolisher
    command: va_brush_biome 0 <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Tile Info
    description: |-
      Print the look-point world position + which 64m tile it belongs to.
      No click required — runs immediately.
    icon: hammer
    command: va_brush_where
    instant: true

  - name: List Tile Anchors
    description: |-
      List all loaded TileAnchors (and any standalone test objects).
    icon: hammer
    command: va_tile_list
    instant: true

  - name: Force VATile Prefab Register
    description: |-
      Force-register the VATile prefab now. Use only if the log shows
      'TileAnchorPrefab' failed to register on ZNetScene.Awake.
    icon: hammer
    command: va_tile_prefab_ensure
    instant: true

# ── VANILLA TERRAIN OPS (WEC) ────────────────────────────────────────────────

  - name: Level
    description: |-
      Flattens vanilla terrain.
      Hold <mod1> to smooth. Hold <mod2> for free mode. Hold <alt> for player height.
    icon: mud_road
    command: terrain level smooth=<mod1>?.5:0 <area>
    terrainGrid: -<mod2>
    playerHeight: <alt>

  - name: Raise
    description: |-
      Raises vanilla terrain.
      Hold <mod1> to smooth. Hold <mod2> for free mode.
    icon: raise
    command: terrain raise=<h> smooth=<mod1>?.5:0 <area>
    initialHeight: 0.2
    terrainGrid: -<mod2>
    snapGround: true

  - name: Slope
    description: Slope between you and aim point.
    icon: wood_wall_roof_45
    command: terrain slope <to>
    targetEdge: true
    initialShape: rectangle

  - name: Pave
    description: Paves vanilla terrain.
    icon: paved_road
    command: terrain paint=paved <area>
    snapGround: true

  - name: Dirt
    description: Paint vanilla dirt.
    icon: Hoe
    command: terrain paint=dirt <area>
    snapGround: true

  - name: Grass
    description: Paint vanilla grass.
    icon: replant
    command: terrain paint=grass <area>
    snapGround: true

  - name: Cultivate
    description: Cultivate vanilla terrain.
    icon: cultivate
    command: terrain paint=cultivated <area>
    snapGround: true

  - name: Reset Terrain
    description: Reset vanilla terrain in area.
    icon: Hoe
    command: terrain reset <area>
    snapGround: true

# ── CREATURE / OBJECT REMOVAL ────────────────────────────────────────────────

  - name: Tame
    description: |-
      Tames creatures. Hold <mod1> to untame.
    icon: Carrot
    command: object tame keys=-<mod1> <area>;object wild keys=<mod1> <area>

  - name: Remove
    description: |-
      Removes objects. Hold <mod1> to also reset the terrain.
    icon: softdeath
    command: tool_object remove id=*;tool_terrain keys=<mod1> reset
    highlight: true

# ── VA WATER PLACEMENT (FiresAdminTerrain) ──────────────────────────────────
# Each tool places a CustomLiquidType disk at the IH ruler cursor.
# Scroll to resize ruler radius; ruler height (Page Up/Down) snaps the
# disk's Y. Delete tool removes any custom water disks overlapping the
# ruler radius.

  - name: Water
    description: |-
      Place a <#66CCFF>Water</color> disk at the cursor — hold LMB to
      drag-paint a river/pond. Surface stays flat at the ruler Y; terrain
      can clip through (use the Waterfall tool for slope-hugging water).
      Scroll to resize. Page Up/Down for Y offset.
    icon: Bucket
    command: va_brush_water <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Waterfall
    description: |-
      Brush-drag a <#66CCFF>Waterfall</color> down a cliff or slope.
      Each dab samples the terrain raycast under the cursor and places a
      shallow water sheet that HUGS the slope at a constant offset, so
      water flows down the rock face like a real waterfall.
      Scroll to resize the stream width.
    icon: gp_waterfall
    command: va_brush_waterfall <area>
    initialSize: 4
    highlight: true
    snapGround: true
    # Round-W-3: ring deforms to terrain shape so the user can see
    # exactly which slope segment the next dab will hit. Every other
    # va_brush_* tool keeps the default flat ring at the cursor Y.
    terrainGrid: true

  - name: Lava
    description: |-
      Place a standalone <#FF4422>Lava</color> disk at the cursor.
      No terrain dig, no biome paint. For Ashlands biome + dig (no swimmable), use Biome Ashlands.
    icon: FlametalOre
    command: va_brush_lava <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Swimmable Lava
    description: |-
      Place a swimmable <#FF4422>lava</color> disk at the cursor.
      Custom lava layer + thin 0.002m water overlay (molten-glass refraction).
      No terrain dig, no biome paint — pair with Biome Ashlands to carve a pit underneath.
    icon: FlametalOre
    command: va_brush_swimmable_lava <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Snow
    description: |-
      Place a <#EEEEFF>snow drift</color> at the cursor. Uses the
      <#FFFF00>LandSnow terrain-anchor</color> pipeline (EXACT clone of
      LandIce mesh-gen): visual-only white mesh that drapes the terrain,
      no MeshCollider, NOT registered with the water system. Zero
      swim/wet/InWater side effects — characters walk straight through
      on the underlying ground.
    icon: WolfPelt
    command: va_brush_snow <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Tar
    description: |-
      Place a <#332222>Tar</color> disk at the cursor.
      Tarred-debuff applied to swimmers; slows movement.
    icon: Tar
    command: va_brush_water_tar <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Boiling Water
    description: |-
      Place a <#FF8866>boiling-water</color> disk at the cursor.
      Deals fire damage while swimming; steam VFX at surface.
    icon: SurtlingCore
    command: va_brush_water_boiling <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Freezing Water
    description: |-
      Place a <#88CCFF>freezing-water</color> disk at the cursor.
      Deals frost damage, applies Freezing status, slows swimming.
    icon: Frost_arrow
    command: va_brush_water_freezing <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Ice
    description: |-
      Place a <#CCEEFF>solid ice</color> disk at the cursor (walkable + slippery).
      Can be broken to reveal water below — fall through holes and swim under,
      then climb back out via the edge prompt (RPG-maker style).
    icon: Crystal
    command: va_brush_water_ice <area>
    initialSize: 10
    highlight: true
    snapGround: true

  - name: Delete Water
    description: |-
      <#FF4444>Delete</color> any custom water disks overlapping the cursor radius.
    icon: SledgeDemolisher
    command: va_brush_water_delete <area>
    initialSize: 10
    highlight: true
    snapGround: true

# ── LAND ICE / LAND SNOW (terrain-anchor mesh, EXACT RPG-maker port) ────────
# Land Ice = slippery walkable overlay that conforms to terrain shape.
#   Includes raise/lower/level/smooth height mods (like a sub-terrain).
# Land Snow = visual-only white drift, no collider, no swim trigger.
#   Same height-mod tools available.

  - name: Place Ice (Auto)
    description: |-
      Place ice at the cursor. <#FFFF00>Auto-detects</color>:
      - On water → <#88CCFF>floating iceberg</color> (collision sides, slippery top, breakable holes).
      - On land  → <#CCEEFF>terrain ice overlay</color> (slippery walkable surface).
      Scroll to resize, Page Up/Down for Y offset.
    icon: Crystal
    command: place_ice circle=<r>-<r2> from=<x>,<z>,<y> offset=<h>
    initialSize: 5
    initialHeight: 0
    highlight: true
    snapGround: true

  - name: Place Ice (Land Force)
    description: |-
      Force a <#CCEEFF>terrain-overlay ice</color> at the cursor (ignores
      water detection). Slippery, conforms to ground shape.
    icon: Crystal
    command: place_ice_land circle=<r>-<r2> from=<x>,<z>,<y> offset=<h>
    initialSize: 5
    initialHeight: 0
    highlight: true
    snapGround: true

  - name: Place Ice (Water Force)
    description: |-
      Force a <#88CCFF>floating ice disk</color> at the cursor (ignores
      land detection). Walkable platform with breakable holes.
